<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>设置含义 - PhysioStudy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="main">
    <div class="hero">
      <h1>设置含义</h1>
      <p>设置窗口用于控制单词学习页的学习模式与自动切题节奏，适合按自己的记忆习惯调整软件行为。</p>
    </div>
    <div class="section">
      <h2>模式说明</h2>
      <ul>
        <li>默写模式：先看题，再手动显示答案并自评。</li>
        <li>浏览模式：系统按设定时间自动显示答案，再自动切到下一题。</li>
      </ul>
    </div>
    <div class="section">
      <h2>参数说明</h2>
      <ul>
        <li>自动显示答案延迟：浏览模式下，题目出现后等待多久显示答案。</li>
        <li>自动下一题延迟：答案显示后，等待多久切换到下一题。</li>
      </ul>
      <div class="note">如果你正在集中默写，建议使用默写模式；如果只是过一遍材料、熟悉词感，建议使用浏览模式。</div>
    </div>
  </div>
</body>
</html>
